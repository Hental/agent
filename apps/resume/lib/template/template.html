<script>
    (() => {
      const root = document.getElementById('report-main');
      const tabs = [...root.querySelectorAll('[role="tab"]')];
      const panels = tabs.map(tab => document.getElementById(tab.getAttribute('aria-controls')));
      function selectTab(index, focus = false) {
        tabs.forEach((tab, i) => {
          tab.setAttribute('aria-selected', String(i === index));
          tab.tabIndex = i === index ? 0 : -1;
          panels[i].hidden = i !== index;
          panels[i].setAttribute('role', 'tabpanel');
          panels[i].tabIndex = 0;
        });
        if (focus) tabs[index].focus();
      }
      tabs.forEach((tab, i) => {
        tab.addEventListener('click', () => selectTab(i));
        tab.addEventListener('keydown', event => {
          let next;
          if (event.key === 'ArrowRight') next = (i + 1) % tabs.length;
          if (event.key === 'ArrowLeft') next = (i + tabs.length - 1) % tabs.length;
          if (event.key === 'Home') next = 0;
          if (event.key === 'End') next = tabs.length - 1;
          if (next !== undefined) { event.preventDefault(); selectTab(next, true); }
        });
      });
      selectTab(0);
      document.documentElement.classList.add('js');
      let closedDetails = [];
      window.addEventListener('beforeprint', () => {
        closedDetails = [...document.querySelectorAll('details:not([open])')];
        closedDetails.forEach(detail => { detail.open = true; });
      });
      window.addEventListener('afterprint', () => {
        closedDetails.forEach(detail => { detail.open = false; });
        closedDetails = [];
      });
      document.querySelectorAll('[data-print-report]').forEach(button => {
        button.addEventListener('click', () => window.print());
      });
      const navLinks = [...document.querySelectorAll('.rail nav a')];
      const sections = navLinks.map(link => document.querySelector(link.getAttribute('href')));
      let scheduled = false;
      function updateNav() {
        const threshold = 160;
        let active = 0;
        sections.forEach((section, i) => { if (section.getBoundingClientRect().top <= threshold) active = i; });
        navLinks.forEach((link, i) => i === active ? link.setAttribute('aria-current', 'location') : link.removeAttribute('aria-current'));
        scheduled = false;
      }
      window.addEventListener('scroll', () => { if (!scheduled) { scheduled = true; requestAnimationFrame(updateNav); } }, {passive:true});
      window.addEventListener('resize', updateNav);
      updateNav();
    })();
  </script>
